name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      # Nunca deben existir datos reales en el repositorio
      - name: Guardia de datos de salud
        run: |
          if git ls-files | grep -Ei '\.(dcm|pdf)$|^bench/private/|^data/|^uploads/'; then
            echo "Archivos que no deben estar en el repositorio"; exit 1; fi
