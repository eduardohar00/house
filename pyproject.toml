[project]
name = "house"
version = "0.0.1"
description = "House: expediente de salud familiar con IA (uso personal, local-first)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
openai = ["openai>=1.0"]
gemini = ["google-genai>=1.0"]
pdf = ["pdfplumber>=0.11"]
app = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
house = ["db/*.sql", "app/web/*", "app/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "N801"]
"src/house/normalize/explanations.py" = ["E501"]  # textos para personas, una línea por análisis
"src/house/app/assistant.py" = ["E501"]  # instrucciones y descripciones de herramientas en prosa
"src/house/app/reviews.py" = ["E501"]  # la instrucción de la revisión es prosa
"src/house/app/bodyscan.py" = ["E501"]  # instrucciones para Claude en prosa
